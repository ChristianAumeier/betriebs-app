<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Betrieb Aumeier</title>
  <meta name="theme-color" content="#2e5d34">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Betrieb Aumeier">
  <link rel="stylesheet" href="anmeldung.css">
  <link rel="stylesheet" href="energie-zuhause.css">
  <link rel="stylesheet" href="pv-stockhalle.css">
  <link rel="stylesheet" href="meldungen.css">
  <link rel="stylesheet" href="stempeln.css">
  <link rel="stylesheet" href="bahnschwellen.css">
  <style>
    :root {
      --gruen: #2e5d34;
      --hintergrund: #f4f5f1;
      --karte: #ffffff;
      --rand: #dfe2da;
      --text: #1d1f1b;
      --grau: #6b6f66;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      background: var(--hintergrund);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--gruen);
      color: #fff;
      padding: calc(env(safe-area-inset-top) + 14px) 16px 14px;
      font-size: 1.25rem;
      font-weight: 600;
    }
    #zurueck {
      display: none;
      border: 0;
      background: none;
      color: #fff;
      font-size: 1.5rem;
      line-height: 1;
      padding: 0 4px;
      cursor: pointer;
    }
    main {
      flex: 1;
      padding: 16px;
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
    }
    .kacheln {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    @media (min-width: 600px) {
      .kacheln { grid-template-columns: repeat(3, 1fr); }
    }
    .kachel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 120px;
      padding: 12px;
      background: var(--karte);
      border: 1px solid var(--rand);
      border-radius: 12px;
      color: var(--text);
      text-decoration: none;
      text-align: center;
      font-size: 1rem;
      font-weight: 600;
    }
    .kachel:active { background: #eef1ea; }
    .kachel .symbol { font-size: 2rem; }
    .kachel .hinweis { font-size: 0.75rem; font-weight: 400; color: var(--grau); }
    .platzhalter {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 50vh;
      text-align: center;
      font-size: 1.1rem;
    }
    footer {
      padding: 8px 16px calc(env(safe-area-inset-bottom) + 8px);
      text-align: center;
      font-size: 0.75rem;
      color: var(--grau);
    }
  </style>
</head>
<body>
  <header>
    <button id="zurueck" aria-label="Zurück zur Startseite">←</button>
    <span id="titel">Betrieb Aumeier</span>
  </header>
  <main id="inhalt"></main>
  <footer>v20</footer>
  <script src="lib/supabase-2.117.2.js"></script>
  <script src="anmeldung.js"></script>
  <script src="energie-zuhause.js"></script>
  <script src="pv-stockhalle.js"></script>
  <script src="meldungen.js"></script>
  <script src="stempeln.js"></script>
  <script src="scanner.js"></script>
  <script src="bahnschwellen.js"></script>
  <script>
    // Die Bereiche der Startseite. Neue Bereiche einfach hier ergänzen.
    // "link" = Kachel öffnet eine andere Seite direkt.
    // "seite" = Funktion, die den Inhalt des Bereichs zeichnet (sonst Platzhalter).
    const BEREICHE = [
      { id: 'energie-biogas', name: 'Energie Biogasanlage', symbol: '⚡' },
      { id: 'getreidelager', name: 'Getreidelager', symbol: '🌾' },
      { id: 'wartung-maschinen', name: 'Wartung Maschinen', symbol: '🚜' },
      { id: 'bahnschwellen', name: 'Bahnschwellen', symbol: '🚛', seite: window.zeigeBahnschwellen },
      { id: 'wartung-biogas', name: 'Wartung Biogasanlage', symbol: '🔧' },
      { id: 'energie-zuhause', name: 'Energie Zuhause', symbol: '🏠', seite: window.zeigeEnergieZuhause },
      { id: 'pv-stockhalle', name: 'PV Stockhalle', symbol: '☀️', seite: window.zeigePvStockhalle },
      { id: 'stempeln', name: 'Stempeln', symbol: '⏱️', seite: window.zeigeStempeln }
    ];

    // Rolle des Angemeldeten (supabase/010_stempeln.sql, 013_fuhren.sql): chef sieht alles;
    // alle anderen sehen „Stempeln“ (wenn sie stempeln) und „Bahnschwellen“ (Fahrer, Transportfirma).
    // Für den Start ohne Netz im Gerät gemerkt.
    const PROFIL_SCHLUESSEL = 'betriebsapp-profil';
    window.Profil = { rolle: 'mitarbeiter' };
    async function profilLaden(offline) {
      try { window.Profil = JSON.parse(localStorage.getItem(PROFIL_SCHLUESSEL)) || window.Profil; } catch (e) {}
      if (offline) return;
      const { data, error } = await window.sb.rpc('mein_profil');
      if (!error && data) {
        window.Profil = data;
        try { localStorage.setItem(PROFIL_SCHLUESSEL, JSON.stringify(data)); } catch (e) {}
      }
    }
    function istChef() { return window.Profil.rolle === 'chef'; }
    function eigeneBereiche() {
      if (istChef()) return BEREICHE;
      const p = window.Profil;
      const ids = [];
      if (p.stempelt || !p.fuhren) ids.push('stempeln');
      if (p.fuhren) ids.push('bahnschwellen');
      return BEREICHE.filter((b) => ids.includes(b.id));
    }

    const inhalt = document.getElementById('inhalt');
    const titel = document.getElementById('titel');
    const zurueck = document.getElementById('zurueck');
    zurueck.addEventListener('click', () => { location.hash = ''; });

    function zeigeStartseite() {
      titel.textContent = 'Betrieb Aumeier';
      zurueck.style.display = 'none';
      // Mitarbeiter, Fahrer, Transportfirma: nur ihre Bereiche (einer = direkt, sonst Kacheln), ohne Störungen
      const bereiche = eigeneBereiche();
      if (!istChef() && bereiche.length === 1) {
        titel.textContent = bereiche[0].name;
        const s = document.createElement('div');
        inhalt.replaceChildren(s, kontoZeile());
        bereiche[0].seite(s);
        return;
      }
      const raster = document.createElement('div');
      raster.className = 'kacheln';
      for (const b of bereiche) {
        const a = document.createElement('a');
        a.className = 'kachel';
        if (b.link) {
          a.href = b.link;
          a.target = '_blank';
          a.rel = 'noopener';
        } else {
          a.href = '#' + b.id;
        }
        a.innerHTML = '<span class="symbol"></span><span class="name"></span>';
        a.querySelector('.symbol').textContent = b.symbol;
        a.querySelector('.name').textContent = b.name;
        if (b.hinweis) {
          const h = document.createElement('span');
          h.className = 'hinweis';
          h.textContent = b.hinweis;
          a.appendChild(h);
        }
        raster.appendChild(a);
      }
      const teile = [];
      if (ohneNetz) {
        const o = document.createElement('div');
        o.className = 'offline-hinweis';
        o.textContent = 'Ohne Netz – angezeigt wird, was auf dem Handy gespeichert ist.';
        teile.push(o);
      }
      // Offene Störungen oben (wichtig und Hinweise), unten die Karte für Mitteilungen
      if (!ohneNetz && istChef()) teile.push(window.Meldungen.leiste());
      teile.push(raster);
      if (!ohneNetz && (istChef() || window.Profil.fuhren)) teile.push(window.Meldungen.karte(istChef() ? undefined : 'Mitteilungen zu den Fuhren'));
      teile.push(kontoZeile());
      inhalt.replaceChildren(...teile);
    }

    // Unten auf der Startseite: wer angemeldet ist, Kennwort ändern, Abmelden
    function kontoZeile() {
      const k = document.createElement('div');
      k.className = 'konto';
      const wer = document.createElement('div');
      window.Anmeldung.benutzerEmail().then((m) => { wer.textContent = m ? 'Angemeldet als ' + m : ''; });
      const kw = document.createElement('button');
      kw.textContent = 'Kennwort ändern';
      kw.addEventListener('click', () => { location.hash = 'kennwort'; });
      const ab = document.createElement('button');
      ab.textContent = 'Abmelden';
      ab.addEventListener('click', () => {
        try { localStorage.removeItem(PROFIL_SCHLUESSEL); } catch (e) {}
        window.Anmeldung.abmelden();
      });
      k.append(wer, kw, ab);
      return k;
    }

    function zeigeBereich(b, rest) {
      titel.textContent = b.name;
      zurueck.style.display = 'block';
      if (b.seite) { b.seite(inhalt, rest); return; }
      const p = document.createElement('div');
      p.className = 'platzhalter';
      p.textContent = 'Hier entsteht der Bereich „' + b.name + '“';
      inhalt.replaceChildren(p);
    }

    function anzeigen() {
      // „#bahnschwellen/123“ = Bereich und Unterseite (z. B. eine Fuhre)
      const [id, rest] = location.hash.slice(1).split('/');
      if (id === 'kennwort') {
        titel.textContent = 'Kennwort ändern';
        zurueck.style.display = 'block';
        window.Anmeldung.kennwortAendern(inhalt, () => { location.hash = ''; });
        return;
      }
      const b = eigeneBereiche().find((x) => x.id === id && !x.link);
      if (b) zeigeBereich(b, rest); else zeigeStartseite();
      window.scrollTo(0, 0);
    }

    // Erst nach erfolgreicher Anmeldung (Kennwort + Code) wird die App gezeigt
    let ohneNetz = false;
    window.Anmeldung.start(inhalt, async (zustand) => {
      ohneNetz = zustand.offline;
      await profilLaden(ohneNetz);
      if (!ohneNetz && (istChef() || window.Profil.fuhren)) window.Meldungen.auffrischen();
      window.addEventListener('hashchange', anzeigen);
      anzeigen();
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
