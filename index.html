<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Betrieb Aumeier</title>
  <meta name="theme-color" content="#2e5d34">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Betrieb Aumeier">
  <style>
    :root {
      --gruen: #2e5d34;
      --hintergrund: #f4f5f1;
      --text: #1d1f1b;
      --grau: #6b6f66;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      background: var(--hintergrund);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    header {
      background: var(--gruen);
      color: #fff;
      padding: calc(env(safe-area-inset-top) + 14px) 16px 14px;
      font-size: 1.25rem;
      font-weight: 600;
    }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      text-align: center;
      font-size: 1.1rem;
    }
    footer {
      padding: 8px 16px calc(env(safe-area-inset-bottom) + 8px);
      text-align: center;
      font-size: 0.75rem;
      color: var(--grau);
    }
  </style>
</head>
<body>
  <header>Betrieb Aumeier</header>
  <main>Hier entsteht die Betriebs-App</main>
  <footer>v1</footer>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
